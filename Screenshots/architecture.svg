<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
<rect width="1000" height="420" rx="10" fill="#0d1117"/>
<text x="500" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#e6edf3">TokenCalibrationKit&#160;&#8212;&#160;estimate&#160;before,&#160;learn&#160;from&#160;the&#160;bill&#160;after</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>
<rect x="20" y="60" width="220" height="120" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
<text x="130" y="82" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#79c0ff">Request&#160;text</text>
<text x="130" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">messages&#160;+&#160;tool&#160;schemas</text>
<text x="130" y="119" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">TextFeatures.prompt(...)</text>
<text x="130" y="136" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">8&#160;scalar&#160;classes&#160;+&#160;framing</text>
<rect x="390" y="60" width="220" height="120" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
<text x="500" y="82" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#d2a8ff">TokenCalibrator&#160;(actor)</text>
<text x="500" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">one&#160;calibration&#160;per&#160;model</text>
<text x="500" y="119" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">rates:&#160;weighted&#160;ridge&#160;fit</text>
<text x="500" y="136" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">errors:&#160;last&#160;200,&#160;out-of-sample</text>
<rect x="760" y="60" width="220" height="120" rx="8" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
<text x="870" y="82" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#7ee787">TokenEstimate</text>
<text x="870" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">point,&#160;lower,&#160;upper</text>
<text x="870" y="119" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">basis:&#160;calibrated&#160;/&#160;prior&#160;band</text>
<text x="870" y="136" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">ContextFit:&#160;fits&#160;/&#160;uncertain&#160;/&#160;overflows</text>
<rect x="390" y="260" width="220" height="120" rx="8" fill="#161b22" stroke="#ffa657" stroke-width="1.5"/>
<text x="500" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffa657">Provider&#160;bill</text>
<text x="500" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">usage.prompt_tokens</text>
<text x="500" y="319" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">record(_:billedTokens:model:)</text>
<text x="500" y="336" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">scored&#160;before&#160;it&#160;is&#160;learned</text>
<rect x="760" y="260" width="220" height="120" rx="8" fill="#161b22" stroke="#ff7b72" stroke-width="1.5"/>
<text x="870" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ff7b72">Drift&#160;test</text>
<text x="870" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">last&#160;20&#160;bills&#160;vs&#160;reference&#160;interval</text>
<text x="870" y="319" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">binomial&#160;tail&#160;&lt;&#160;0.001</text>
<text x="870" y="336" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">restart&#160;from&#160;the&#160;prior</text>
<rect x="20" y="260" width="220" height="120" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
<text x="130" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#8b949e">CalibrationSnapshot</text>
<text x="130" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">Codable,&#160;~3.5&#160;KB&#160;per&#160;model</text>
<text x="130" y="319" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">persist&#160;across&#160;launches</text>
<text x="130" y="336" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">validated&#160;on&#160;restore</text>
<line x1="240" y1="120" x2="388" y2="120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="314" y="114" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">estimate</text>
<line x1="610" y1="120" x2="758" y2="120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="684" y="114" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">before&#160;sending</text>
<line x1="500" y1="258" x2="500" y2="182" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="500" y="214" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">learn</text>
<line x1="610" y1="320" x2="758" y2="320" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="684" y="314" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">misses</text>
<line x1="388" y1="320" x2="242" y2="320" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="315" y="314" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">snapshot()</text>
</svg>
